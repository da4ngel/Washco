<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — WashCo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #eaf4fe;
        color: #0f2167;
        text-align: center;
        padding: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #08121e;
          color: #eaf4fe;
        }
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #0f2167;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
      }
      p {
        margin: 0;
        opacity: 0.8;
        max-width: 28ch;
      }
      button {
        margin-top: 0.5rem;
        border: none;
        border-radius: 999px;
        padding: 0.6rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 600;
        background: #4ade80;
        color: #0f2167;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M8 20c0-3 2-5 4-8 1.4 2 2 3 2 4.5A2 2 0 0 1 12 18.5 2 2 0 0 1 10 16.5"
          fill="none"
          stroke="#4ADE80"
          stroke-width="2"
          stroke-linecap="round"
        />
        <circle cx="20" cy="18" r="4.5" fill="none" stroke="#4ADE80" stroke-width="2" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>WashCo needs a connection to load this page. Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
